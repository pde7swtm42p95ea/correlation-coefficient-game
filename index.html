<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>📊 相関係数 当てゲーム</title>
<style>
:root {
--bg:#fafafa; --border:#ccc;
--ok:#007bff; --ng:#ff3333;
--btn-check:#007bff; --btn-next:#28a745;
}
html,body{margin:0;background:var(--bg);font-family:'Hiragino Kaku Gothic ProN','Segoe UI',sans-serif;}
.container{max-width:480px;margin:0 auto;padding:4px;text-align:center;}
h2{margin:4px 0;font-size:clamp(1rem,2.5vw,1.3rem);}
p{margin:4px 0;font-size:0.9rem;}
#score{margin:4px 0;font-size:0.9rem;}
#hearts{font-size:18px;margin:4px 0;}

.canvas-wrap{display:flex;justify-content:center;margin:4px 0;}
canvas{width:80vw;max-width:300px;aspect-ratio:1/1;background:#fff;
border:1px solid var(--border);border-radius:8px;}

.choice-container{
display:flex;flex-wrap:wrap;justify-content:center;
margin:6px auto;max-width:320px;
}
.choice-container label{
display:flex;align-items:center;justify-content:center;
gap:4px;padding:6px;border-radius:6px;background:#fff;border:1px solid #ddd;
cursor:pointer;font-size:14px;width:31%;margin:2px;
box-sizing:border-box;
}
.choice-container label:hover{background:#f5f5f5;}
input[type="radio"]{transform:scale(1.1);}

#result{font-weight:700;margin-top:6px;min-height:2.2em;transition:color .25s;font-size:0.95rem;}

footer{position:sticky;bottom:0;background:var(--bg);
padding:6px 0;border-top:1px solid var(--border);display:flex;justify-content:center;}
.btn-row{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;width:100%;max-width:420px;}
.btn{
padding:8px 10px;border-radius:6px;border:1px solid var(--border);
font-size:0.9rem;color:#fff;cursor:pointer;
flex:1 1 120px;max-width:160px;
transition:opacity .25s,transform .25s;
}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
#checkBtn{background:var(--btn-check);}
#nextBtn{background:var(--btn-next);}
.btn:hover:not(:disabled){opacity:0.85;}

@keyframes flashBlue {0%,100%{box-shadow:0 0 0 rgba(0,123,255,0);}50%{box-shadow:0 0 12px rgba(0,123,255,0.8);}}
@keyframes flashRed {0%,100%{box-shadow:0 0 0 rgba(255,51,51,0);}50%{box-shadow:0 0 12px rgba(255,51,51,0.8);}}
@keyframes flashGreen {0%,100%{box-shadow:0 0 0 rgba(40,167,69,0);}50%{box-shadow:0 0 12px rgba(40,167,69,0.8);}}
.flash-blue{animation:flashBlue 0.8s ease;}
.flash-red{animation:flashRed 0.8s ease;}
.flash-green{animation:flashGreen 0.8s ease;}

/* 🔹 スタート画面 */
#startScreen{
max-width:420px;margin:0 auto;padding:20px 16px;text-align:left;
}
#startScreen h1{font-size:1.3rem;text-align:center;margin:8px 0 16px;}
#startScreen .rules{
background:#fff;border:1px solid var(--border);border-radius:8px;
padding:12px 16px;margin-bottom:16px;font-size:0.9rem;line-height:1.7;
}
#startScreen .rules li{margin-bottom:6px;}
#startBtn{
display:block;margin:0 auto;background:var(--btn-check);color:#fff;
border:none;border-radius:8px;padding:12px 32px;font-size:1.05rem;
cursor:pointer;
}
#startBtn:hover{opacity:0.85;}
#gameScreen{display:none;}
</style>
</head>
<body>
<div id="startScreen">
<h1>📊 相関係数 当てゲーム</h1>
<div class="rules">
<strong>ルール</strong>
<ul>
<li>表示された散布図を見て、その相関係数に最も近い数値を6つの選択肢から選びます。</li>
<li>「答え合わせ」を押すと正誤と実際の相関係数が表示されます。</li>
<li>全部で<strong>30問</strong>出題されます。最後まで解くと最終正解数が表示されます。</li>
<li>3回間違えると、その時点でゲームオーバーになります。</li>
<li>5問正解するごとにレベルが上がり、散布図のばらつき方が変化します。</li>
<li>ゲームオーバー・終了後は「もう一度挑戦する」でリスタートできます。</li>
</ul>
</div>
<button id="startBtn">ゲームスタート</button>
</div>

<div id="gameScreen">
<div class="container">
<h2>📊 相関係数 当てゲーム</h2>
<div id="score">問題: 1 / 30　レベル: 1　合計正解: 0</div>
<div id="hearts">💖💖💖</div>

<div class="canvas-wrap"><canvas id="scatter" width="300" height="300"></canvas></div>
<div class="choice-container" id="choices"></div>
<p id="result"></p>
</div>

<footer>
<div class="btn-row">
<button class="btn" id="checkBtn">答え合わせ</button>
<button class="btn" id="nextBtn">次の問題へ</button>
<button class="btn" id="restartBtn" style="background:#6c757d;display:none;">もう一度挑戦する</button>
</div>
</footer>
</div>

<script>
const TOTAL_QUESTIONS = 30;
const maxMistakes = 3;

let trueR=0, points=[], totalCorrect=0, wrongCount=0, answered=false, level=1;
let questionNum=0, gameEnded=false;

function randn(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function clamp(v,min,max){return Math.min(Math.max(v,min),max);}
function to2(v){return Number(Number(v).toFixed(2));}
function getStdDevByLevel(lv){return lv===1?0.6:lv===2?0.8:lv===3?1.5:2.0;}
function getColorByLevel(lv){return lv===1?"steelblue":lv===2?"orange":lv===3?"green":"crimson";}

function generateData(r,n=100,lv=1){
const d=[],sd=getStdDevByLevel(lv),safeR=clamp(r,-0.9999,0.9999);
for(let i=0;i<n;i++){const x=randn()*sd, y=safeR*x+Math.sqrt(1-safeR*safeR)*randn()*sd;d.push([x,y]);}
return d;
}

// 実際に生成された点から標本相関係数を計算(表示上の「正解」はこちらを使う)
function pearson(data){
const n=data.length;
const mx=data.reduce((s,[x])=>s+x,0)/n;
const my=data.reduce((s,[,y])=>s+y,0)/n;
let num=0, dx2=0, dy2=0;
data.forEach(([x,y])=>{
const dx=x-mx, dy=y-my;
num+=dx*dy; dx2+=dx*dx; dy2+=dy*dy;
});
return num/Math.sqrt(dx2*dy2);
}

function drawScatter(data){
const c=document.getElementById('scatter'),ctx=c.getContext('2d');
const cssSize=Math.min(window.innerWidth*0.8,300);
c.style.width=cssSize+'px';c.style.height=cssSize+'px';
c.width=cssSize;c.height=cssSize;
ctx.clearRect(0,0,cssSize,cssSize);
ctx.fillStyle=getColorByLevel(level);
const center=cssSize/2,scale=cssSize/5;
data.forEach(([x,y])=>{
const px=center+x*scale,py=center-y*scale;
ctx.beginPath();ctx.arc(px,py,2.5,0,Math.PI*2);ctx.fill();
});
}

function createChoicesStrict(trueRVal){
const minDiff=0.15;
const group=(cnt,min,max,avoid=[])=>{
const arr=[];let tries=0;
while(arr.length<cnt && tries<500){
const v=to2(min+Math.random()*(max-min));
if([...arr,...avoid].every(a=>Math.abs(a-v)>=minDiff))arr.push(v);
tries++;
}
while(arr.length<cnt){ // フォールバック(まれに範囲内で見つからない場合)
arr.push(to2(min+Math.random()*(max-min)));
}
return arr;
};
let pos,neg;
if(trueRVal>=0){
pos=group(3,0.15,1,[trueRVal]);
pos[Math.floor(Math.random()*3)]=trueRVal;
neg=group(3,-1,-0.15,pos);
}else{
neg=group(3,-1,-0.15,[trueRVal]);
neg[Math.floor(Math.random()*3)]=trueRVal;
pos=group(3,0.15,1,neg);
}
return [...neg,...pos].sort((a,b)=>a-b);
}

function updateScore(){
document.getElementById('score').textContent=
`問題: ${Math.min(questionNum,TOTAL_QUESTIONS)} / ${TOTAL_QUESTIONS}　レベル: ${level}　合計正解: ${totalCorrect}`;
const brokenHearts=Math.min(wrongCount,maxMistakes);
const hearts='💖'.repeat(Math.max(0,maxMistakes-brokenHearts))+'💔'.repeat(brokenHearts);
document.getElementById('hearts').textContent=hearts;
}

function disableChoices(dis){
document.querySelectorAll('input[name="rchoice"]').forEach(i=>i.disabled=dis);
}

function newQuestion(){
if(gameEnded) return;
questionNum++;
answered=false;
const res=document.getElementById('result');
res.textContent='';res.style.color='#000';
level=Math.floor(totalCorrect/5)+1;

const targetR=to2(Math.random()*2-1);
points=generateData(targetR,100,level);
trueR=to2(pearson(points)); // 実測の相関係数を正解とする

drawScatter(points);
const ch=createChoicesStrict(trueR),c=document.getElementById('choices');
c.innerHTML='';
ch.forEach(v=>{
const label=document.createElement('label');
label.innerHTML=`<input type="radio" name="rchoice" value="${v}"> ${v.toFixed(2)}`;
c.appendChild(label);
});
disableChoices(false); updateScore();
document.getElementById('checkBtn').disabled=false;
document.getElementById('nextBtn').disabled=true;
}

function endGame(reason){
gameEnded=true;
disableChoices(true);
document.getElementById('checkBtn').style.display='none';
document.getElementById('nextBtn').style.display='none';
document.getElementById('restartBtn').style.display='inline-block';
const res=document.getElementById('result');
const label = reason==='cleared' ? '🏁 全30問終了!' : '💀 ゲームオーバー!';
res.innerHTML=`${label}<br><span style="font-size:1.4rem;color:red;">最終正解数: ${totalCorrect} / ${TOTAL_QUESTIONS}</span>`;
updateScore();
}

function restartGame(){
totalCorrect=0; wrongCount=0; questionNum=0; level=1; gameEnded=false;
document.getElementById('checkBtn').style.display='inline-block';
document.getElementById('nextBtn').style.display='inline-block';
document.getElementById('restartBtn').style.display='none';
newQuestion();
}

function checkAnswer(){
if(answered||gameEnded)return;
const sel=document.querySelector('input[name="rchoice"]:checked');
if(!sel){alert('選択肢を選んでください！');return;}
answered=true;
const v=parseFloat(sel.value),res=document.getElementById('result');
const btn=document.getElementById('checkBtn');
btn.classList.remove('flash-blue','flash-red');
void btn.offsetWidth;

if(Math.abs(v-trueR)<0.001){
totalCorrect++;
res.textContent=`🎯 正解！ 実際の相関係数は ${trueR.toFixed(2)}`;
res.style.color='var(--ok)'; btn.classList.add('flash-blue');
}else{
wrongCount++;
res.textContent=`❌ 残念！ 正解は ${trueR.toFixed(2)} でした。`;
res.style.color='var(--ng)'; btn.classList.add('flash-red');
}
disableChoices(true); updateScore();
document.getElementById('checkBtn').disabled=true;

if(wrongCount>=maxMistakes){
endGame('gameover');
}else if(questionNum>=TOTAL_QUESTIONS){
endGame('cleared');
}else{
document.getElementById('nextBtn').disabled=false;
}
}

function nextQuestion(){
if(gameEnded)return;
const btn=document.getElementById('nextBtn');
btn.classList.remove('flash-green');
void btn.offsetWidth;
btn.classList.add('flash-green');
newQuestion();
}

document.getElementById('checkBtn').onclick=checkAnswer;
document.getElementById('nextBtn').onclick=nextQuestion;
document.getElementById('restartBtn').onclick=restartGame;
window.onresize=()=>{ if(points.length) drawScatter(points); };

document.getElementById('startBtn').onclick=()=>{
document.getElementById('startScreen').style.display='none';
document.getElementById('gameScreen').style.display='block';
newQuestion();
};
</script>
</body>
</html>
